# Allow pam_howdy to open V4L cameras from polkit's sandboxed authentication helper (polkit 127+)
[Service]
PrivateDevices=no
DeviceAllow=char-video4linux rw

# Restore the restrictions PrivateDevices=yes implied, so only camera access is added
CapabilityBoundingSet=~CAP_MKNOD CAP_SYS_RAWIO
SystemCallFilter=~@raw-io
